<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird - KAN-17</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <h1 class="title">Flappy Bird</h1>
    <div id="game-container">
      <div id="background"></div>
      <div id="bird"></div>
      <div id="ground"></div>
      <div id="ui-overlay">
        <div id="score">0</div>
        <div id="start-screen" class="screen visible">
          <h2>Tap, Click, or Press Space to Start</h2>
          <p>Controls: Space / ↑, Mouse Click, or Touch</p>
        </div>
        <div id="game-over-screen" class="screen">
          <h2>Game Over</h2>
          <p>Score: <span id="final-score">0</span></p>
          <p>Best: <span id="best-score">0</span></p>
          <button id="restart-btn">Play Again</button>
        </div>
      </div>
    </div>
    <p class="instructions">Open this file in a modern browser to play. Best experienced in landscape on mobile.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
